<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scroll Engine Test</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

    <!-- Link your external CSS file here -->
    <link rel="stylesheet" href="src/css/scrollEffect.css">

    <!-- Minimal inline resets & overrides for instant testing -->
    <style>

        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Fixed Layout Bug: Grid stacking for absolute face overlays */


        .message-face {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            color: #f0f3f8;
            max-width: 800px;
            padding: 0 20px;
        }

        /* Section padding so you can scroll into and out of the track */
        .scroll-spacer {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #161b22;
            color: #8b949e;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<!-- Spacer before scroll engine -->
<div class="scroll-spacer">
    <p>↓ Scroll Down to trigger 3D Text Sequence ↓</p>
</div>

<!-- ==================== 3D SCROLL ENGINE STAGE ==================== -->
<section id="heroSection" class="hero-scroll-track">
    <div class="sticky-stage">
        <div id="a11y-announcer" aria-live="polite" class="sr-only"></div>

        <!-- 3D Wrapper -->
        <div class="scroll-message-wrapper" data-dir="down">
            <div id="messageContainer" class="message-container"></div>
        </div>

        <!-- HUD Navigation -->
        <nav id="scrollProgress" class="hud-navigation visible">
            <div id="hudCounter" class="hud-counter">01 / 04</div>
            <div class="progress-track-container">
                <div class="progress-track-bg">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
        </nav>
    </div>
</section>

<!-- Spacer after scroll engine -->
<div class="scroll-spacer" style="height: 100vh;">
    <p>Sequence Complete ↑ Scroll Up</p>
</div>

<!-- ==================== ENGINE INITIALIZATION SCRIPT ==================== -->
<script type="module">
    import { ScrollEngine } from './src/scrollEngine.ts';
    // Text slides to render in 3D
    const slideMessages = [
        'A legacy of <span class="message-highlight">EXCELLENCE</span><br>forged in faith and discipline',
        'Nurturing brilliant <span class="message-highlight">MINDS</span><br>and compassionate <span class="message-highlight">HEARTS</span>',
        'Where academic rigor meets<br><span class="message-highlight">MORAL COURAGE</span>',
        'Empowering a generation to<br><span class="message-highlight">LEAD</span> with unwavering integrity',
        'A community bound by<br><span class="message-highlight">PURPOSE</span> and <span class="message-highlight">SERVICE</span>',
        '“<span class="message-highlight">Edificamus Regnum Dei</span>”<br><span style="display: block; font-family: \'Plus Jakarta Sans\', sans-serif; font-size: 0.45em; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; margin-top: 1.2rem; color: rgba(255,255,255,0.65); text-shadow: none;">Let us build the house of God</span>'
    ];

    try {
        // @ts-ignore
        const scrollEngine = new ScrollEngine({
            messages: slideMessages,
            heroId: 'heroSection',
            containerId: 'messageContainer',
            navId: 'scrollProgress',
            fillId: 'progressFill',
            counterId: 'hudCounter',
            a11yId: 'a11y-announcer',
            canvasId: 'dustCanvas'
        });
        scrollEngine.init()
    } catch (error) {
        console.error("Scroll Engine Initialization Failed:", error);
    }
</script>
</body>
</html>
